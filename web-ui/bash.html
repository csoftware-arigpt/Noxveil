<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Noxveil // server shell</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Full-height app page: the terminal owns the viewport */
        .app-main { overflow: hidden; }

        @media (max-width: 768px) {
            .input-line { flex-direction: column; align-items: stretch; }
            .prompt { text-align: left; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
            <div class="sidebar-brand">
                <span class="brand-mark" aria-hidden="true">N</span>
                <span class="brand-name">Noxveil<span class="brand-sub">opcon</span></span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">workspace</div>
                <a class="sidebar-link" href="/dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                    Dashboard
                </a>
                <a class="sidebar-link" href="/terminal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                    Agent terminal
                </a>
                <a class="sidebar-link active" href="/shell" aria-current="page">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><line x1="6" y1="6.5" x2="6.01" y2="6.5"/><line x1="6" y1="17.5" x2="6.01" y2="17.5"/></svg>
                    Server shell
                </a>
            </nav>
            <div class="sidebar-foot">
                <div class="operator-chip">
                    <span class="operator-dot" aria-hidden="true"></span>
                    <span>operator</span>
                </div>
                <button class="btn btn-small btn-ghost" id="logoutBtn">Sign out</button>
            </div>
        </aside>

        <div class="sidebar-scrim" id="sidebarScrim" aria-hidden="true"></div>

        <div class="app-main">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="icon-btn" id="sidebarToggle" aria-label="Toggle navigation" aria-controls="sidebar">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
                    </button>
                    <div class="topbar-titles">
                        <div class="topbar-title">Server shell</div>
                        <div class="topbar-sub">interactive bash on the noxveil host</div>
                    </div>
                </div>
                <div class="topbar-right">
                    <span class="status disconnected" id="connectionStatus">
                        <span class="status-indicator" aria-hidden="true"></span>
                        <span>disconnected</span>
                    </span>
                    <a href="/dashboard" class="btn btn-small btn-ghost">dashboard</a>
                </div>
            </header>

            <div class="shell-page-main">
                <div class="terminal-container">
                    <div class="session-toolbar" id="sessionToolbar">
                        <button class="btn btn-small" id="copySessionBtn">copy log</button>
                        <button class="btn btn-small" id="saveSessionBtn">save log</button>
                        <button class="btn btn-small" id="clearSessionBtn">clear</button>
                        <button class="btn btn-small btn-warning" id="reconnectShellBtn">reconnect</button>
                        <button class="shell-preset" data-shell-command="pwd">pwd</button>
                        <button class="shell-preset" data-shell-command="whoami">whoami</button>
                        <button class="shell-preset" data-shell-command="hostname">hostname</button>
                        <button class="shell-preset" data-shell-command="sudo -l">sudo -l</button>
                    </div>
                    <div id="terminal">
                        <div class="output-line info">// connecting to noxveil server shell...</div>
                    </div>
                    <div class="input-line">
                        <span class="prompt" id="prompt">server@noxveil:~$</span>
                        <input type="text" id="commandInput" placeholder="enter a command..." autocomplete="off" autofocus aria-label="Server shell command input">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="history-indicator" id="historyIndicator">
        history: <span id="historyPosition">0</span>/<span id="historyTotal">0</span>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        if (!Auth.isAuthenticated()) {
            window.location.href = "/login";
        }

        let ws = null;
        let commandHistory = [];
        let historyIndex = -1;
        let isConnected = false;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 10;
        let awaitingSecretInput = false;
        let sessionTranscript = [];
        let escBuffer = "";

        const terminal = document.getElementById("terminal");
        const commandInput = document.getElementById("commandInput");
        const connectionStatus = document.getElementById("connectionStatus");
        const prompt = document.getElementById("prompt");
        const historyIndicator = document.getElementById("historyIndicator");
        const historyPosition = document.getElementById("historyPosition");
        const historyTotal = document.getElementById("historyTotal");
        const inputLine = document.querySelector(".input-line");

        // Strip ANSI/VT escape sequences and normalize control characters so the
        // PTY stream renders as plain text instead of raw terminal codes.
        function sanitizeChunk(raw) {
            let text = escBuffer + String(raw ?? "");
            escBuffer = "";

            // OSC sequences: ESC ] ... (BEL | ESC \)
            text = text.replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g, "");
            // CSI sequences: ESC [ ... final byte
            text = text.replace(/\x1b\[[0-?]*[ -/]*[@-~]/g, "");
            // Other two-byte escape sequences
            text = text.replace(/\x1b[@-Z\\-_]/g, "");
            // Line ending normalization
            text = text.replace(/\r\n/g, "\n");
            text = text.replace(/\r/g, "");
            // Drop remaining C0 control characters except \n and \t
            text = text.replace(/[\x00-\x08\x0b-\x1f\x7f]/g, "");

            // Hold back an escape sequence cut in half between chunks
            const tail = text.match(/\x1b(?:\[[0-?]*[ -/]*|\][^\x07\x1b]*)?$/);
            if (tail && tail[0]) {
                escBuffer = tail[0];
                text = text.slice(0, text.length - tail[0].length);
            }
            return text;
        }

        function addOutput(text, type = "success") {
            const line = document.createElement("div");
            line.className = `output-line ${type}`;
            line.textContent = text;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
            sessionTranscript.push(`${text}\n`);
        }

        function appendStream(text, type = "success") {
            if (!text) return;
            const span = document.createElement("span");
            span.className = `output-chunk ${type}`;
            span.textContent = text;
            terminal.appendChild(span);
            terminal.scrollTop = terminal.scrollHeight;
            sessionTranscript.push(text);
        }

        function sendResize() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const cols = Math.max(20, Math.min(500, Math.floor(terminal.clientWidth / 8)));
                const rows = Math.max(5, Math.min(200, Math.floor(terminal.clientHeight / 20)));
                ws.send(JSON.stringify({ type: "resize", rows, cols }));
            }
        }

        function updateSecretInputMode(enabled) {
            awaitingSecretInput = enabled;
            commandInput.type = enabled ? "password" : "text";
            commandInput.placeholder = enabled ? "sudo password..." : "enter a command...";
            inputLine.classList.toggle("secret-mode", enabled);
        }

        function detectSecretPrompt(text) {
            const secretPrompt = /(password|passphrase)[^:\n\r]{0,80}:\s*$/i.test(text);
            const shellPrompt = /(^|\n)[^\n\r]*[#$>]\s$/m.test(text);

            if (secretPrompt) {
                updateSecretInputMode(true);
                return;
            }

            if (shellPrompt || /sorry, try again/i.test(text)) {
                updateSecretInputMode(false);
            }
        }

        function addToHistory(command) {
            if (command.trim() && command !== commandHistory[commandHistory.length - 1]) {
                commandHistory.push(command);
                if (commandHistory.length > 200) {
                    commandHistory = commandHistory.slice(-200);
                }
                historyIndex = commandHistory.length;
                updateHistoryIndicator();
            }
        }

        function updateHistoryIndicator() {
            historyPosition.textContent = String(Math.min(historyIndex + 1, commandHistory.length));
            historyTotal.textContent = String(commandHistory.length);
            if (commandHistory.length > 0) {
                historyIndicator.classList.add("show");
            } else {
                historyIndicator.classList.remove("show");
            }
        }

        function connect() {
            const token = Auth.getToken();
            if (!token) {
                Auth.logout();
                return;
            }

            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${protocol}//${window.location.host}/api/v1/ws/bash?token=${encodeURIComponent(token)}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                isConnected = true;
                reconnectAttempts = 0;
                connectionStatus.className = "status connected";
                connectionStatus.innerHTML = `<span class="status-indicator"></span><span>connected</span>`;
                addOutput("connected to noxveil server shell", "info");
                commandInput.focus();
                sendResize();
            };

            ws.onmessage = function(event) {
                const message = JSON.parse(event.data);
                switch (message.type) {
                    case "connected":
                        addOutput(message.data, "info");
                        if (message.hostname) {
                            prompt.textContent = `server@${message.hostname}:~$`;
                        }
                        break;
                    case "output": {
                        const clean = sanitizeChunk(message.data);
                        if (clean) {
                            appendStream(clean, message.is_error ? "error" : "success");
                        }
                        detectSecretPrompt(clean);
                        break;
                    }
                    case "ping":
                        ws.send(JSON.stringify({ type: "pong" }));
                        break;
                    case "error":
                        addOutput(message.data, "error");
                        updateSecretInputMode(false);
                        break;
                    case "shell_exit":
                        addOutput(message.data, "warning");
                        updateSecretInputMode(false);
                        break;
                }
            };

            ws.onclose = function() {
                isConnected = false;
                connectionStatus.className = "status disconnected";
                connectionStatus.innerHTML = `<span class="status-indicator"></span><span>disconnected</span>`;
                updateSecretInputMode(false);

                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts += 1;
                    addOutput(`connection lost. reconnecting (${reconnectAttempts}/${maxReconnectAttempts})...`, "warning");
                    setTimeout(connect, Math.min(1000 * reconnectAttempts, 5000));
                } else {
                    addOutput("reconnect limit reached. refresh the page to try again", "error");
                }
            };

            ws.onerror = function(error) {
                console.error("WebSocket error:", error);
            };
        }

        function copySessionTranscript() {
            const payload = sessionTranscript.join("");
            if (!payload.trim()) {
                addOutput("transcript is empty", "error");
                return;
            }
            navigator.clipboard.writeText(payload)
                .then(() => addOutput("transcript copied to clipboard", "info"))
                .catch(() => addOutput("could not copy transcript", "error"));
        }

        function saveSessionTranscript() {
            const payload = sessionTranscript.join("");
            if (!payload.trim()) {
                addOutput("transcript is empty", "error");
                return;
            }
            const blob = new Blob([payload], { type: "text/plain;charset=utf-8" });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `server-shell-${Date.now()}.txt`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => window.URL.revokeObjectURL(url), 1000);
            addOutput("transcript saved", "info");
        }

        function clearSessionView() {
            terminal.innerHTML = "";
            sessionTranscript = [];
            addOutput("terminal view cleared", "info");
        }

        function executeCommand(command) {
            if (!isConnected) return;

            const value = String(command ?? "");
            const trimmed = value.trim();
            if (!awaitingSecretInput && !trimmed) return;

            if (!awaitingSecretInput && trimmed) {
                addToHistory(trimmed);
                // The PTY echoes the prompt and the command itself, so the raw
                // command is not duplicated into the transcript here.
            } else if (awaitingSecretInput) {
                sessionTranscript.push(`$ ********\n`);
            }

            ws.send(JSON.stringify({ type: "input", data: value }));
            if (awaitingSecretInput) {
                updateSecretInputMode(false);
            }
        }

        commandInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                const command = commandInput.value;
                executeCommand(command);
                commandInput.value = "";
            } else if (event.key === "ArrowUp") {
                event.preventDefault();
                if (awaitingSecretInput) return;
                if (historyIndex > 0) {
                    historyIndex -= 1;
                    commandInput.value = commandHistory[historyIndex];
                    updateHistoryIndicator();
                }
            } else if (event.key === "ArrowDown") {
                event.preventDefault();
                if (awaitingSecretInput) return;
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex += 1;
                    commandInput.value = commandHistory[historyIndex];
                    updateHistoryIndicator();
                } else {
                    historyIndex = commandHistory.length;
                    commandInput.value = "";
                    updateHistoryIndicator();
                }
            } else if (event.ctrlKey && event.key === "l") {
                event.preventDefault();
                clearSessionView();
            } else if (event.ctrlKey && event.key === "c") {
                event.preventDefault();
                if (isConnected && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "signal", data: "interrupt" }));
                }
                addOutput("^C", "info");
                updateSecretInputMode(false);
            }
        });

        document.getElementById("copySessionBtn").addEventListener("click", copySessionTranscript);
        document.getElementById("saveSessionBtn").addEventListener("click", saveSessionTranscript);
        document.getElementById("clearSessionBtn").addEventListener("click", clearSessionView);
        document.getElementById("reconnectShellBtn").addEventListener("click", () => {
            reconnectAttempts = 0;
            if (ws) {
                try { ws.close(); } catch (_error) { connect(); }
            } else {
                connect();
            }
        });
        document.getElementById("sessionToolbar").addEventListener("click", (event) => {
            const preset = event.target.closest("[data-shell-command]");
            if (!preset) return;
            commandInput.value = preset.getAttribute("data-shell-command") || "";
            commandInput.focus();
        });

        terminal.addEventListener("click", function() {
            commandInput.focus();
        });

        window.addEventListener("beforeunload", () => {
            if (ws) {
                ws.onclose = null;
                ws.close();
            }
        });

        window.addEventListener("resize", () => sendResize());

        connect();
        setTimeout(() => {
            addOutput("// tips:", "info");
            addOutput("  ↑/↓  command history", "success");
            addOutput("  ctrl+l  clear terminal", "success");
            addOutput("  ctrl+c  interrupt running command", "success");
            addOutput("  sudo prompts switch input to hidden mode", "warning");
        }, 500);
    </script>
    <script>
        // Navigation drawer (mobile) + sign out
        document.getElementById("sidebarToggle")?.addEventListener("click", () => {
            document.body.classList.toggle("sidebar-open");
        });
        document.getElementById("sidebarScrim")?.addEventListener("click", () => {
            document.body.classList.remove("sidebar-open");
        });
        document.getElementById("logoutBtn")?.addEventListener("click", () => Auth.logout());
    </script>
</body>
</html>
